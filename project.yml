name: PocketAILab
options:
  bundleIdPrefix: xyz.noxhub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SUPPORTS_MACCATALYST: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: "Pocket AI Lab"
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Chọn ảnh để AI xử lý offline trên iPhone."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Ghi âm để chuyển giọng nói thành văn bản ngay trên iPhone."
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Nhận dạng giọng nói offline nếu thiết bị và ngôn ngữ hỗ trợ."
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
packages:
  SwiftLlama:
    url: https://github.com/pgorzelany/swift-llama-cpp.git
    revision: d2750c52f5310596fede783ad1122c66cbd30855
targets:
  PocketAILab:
    type: application
    platform: iOS
    sources:
      - path: PocketAILab
    dependencies:
      - package: SwiftLlama
        product: SwiftLlama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.noxhub.pocketailab
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        OTHER_LDFLAGS: "$(inherited)"
        SWIFT_EMIT_LOC_STRINGS: "YES"
